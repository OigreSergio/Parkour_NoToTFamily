name: Sync mappa spot

# Rigenera i dati della mappa (lista Google Maps "Parkour spot" -> spot
# fissi -> foto collegate) e aggiorna il bundle già pubblicato su gh-pages.
# Lancio manuale (workflow_dispatch) dal branch che contiene gli script.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rigenera i dati degli spot
        run: |
          python3 scripts/fetch_gmaps_list.py
          python3 scripts/import_gmaps_list_spots.py
          python3 scripts/wire_spot_photos.py

      - name: Commit dei dati sul branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data backend/seeds/spots.json
          git diff --cached --quiet || git commit -m "chore: rigenera spot e foto dalla lista Google Maps"
          git push

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ghp

      - name: Patch del bundle pubblicato
        run: |
          python3 scripts/update_deployed_spots.py ghp/t/*/_expo/static/js/web/entry-*.js

      - name: Commit su gh-pages
        run: |
          cd ghp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: aggiorna spot e foto sul bundle di anteprima"
          git push
