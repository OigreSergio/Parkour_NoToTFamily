name: App installabile

# Controlla che l'app di `app/` sia coerente con le sue fonti e che funzioni
# davvero, offline compreso. Due lavori separati, perché falliscono per
# ragioni diverse:
#
#   dati    → i file generati (spot, fontanelle, tutorial, icone, elenco
#             offline) corrispondono a ciò che li genera? Se qualcuno cambia
#             una fonte e dimentica di rigenerare, l'app pubblicata mostra
#             dati vecchi senza che nessuno se ne accorga.
#   prove   → l'app si apre, si naviga, e **spento il server continua a
#             funzionare**: è la promessa dell'applicazione, e va verificata
#             a ogni modifica.
#
# Non pubblica niente: mettere l'app online è una scelta di una persona
# (masterplan cap. 4.6 e decisioni aperte).
#
# Il Python installato è la 3.14, il pavimento del repository: gli strumenti di
# `app/tools/` girano solo qui e sulla macchina di chi sviluppa. Quello che
# invece finisce sul computer di chi prova l'app — `app/mac/avvia.py`, la
# stringa AVVIATORE dentro `app/tools/build_beta.py`, e `app/demo/motore.py`
# con l'avviatore incorporato in `app/tools/build_demo_python.py` — resta
# compatibile dalla 3.9 in su, perché lì la versione non la scegliamo noi.
#
# Attenzione a cosa prova davvero il lavoro `prove`, perché non è ovvio: la
# demo in un file solo viene costruita e avviata sul serio
# (`app/tests/motore-python.spec.mjs`), ma con la 3.14 di qui, e
# `build_demo_python.py` confronta la sola *sintassi* con la 3.9. Le novità
# che si vedono solo all'esecuzione (`datetime.UTC`, `Path.copy`,
# `itertools.batched`) passano quel controllo e si rompono sul computer di
# chi apre la demo. L'avviatore della beta e quello del Mac non li esegue
# nessuno: qui un verde non dice niente sulla loro compatibilità.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/data/**"
      - "backend/seeds/videos.json"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/data/**"
      - "backend/seeds/videos.json"
      - ".github/workflows/app.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dati:
    name: I file generati sono aggiornati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Dati offline (spot, fontanelle, tutorial)
        run: python3 app/tools/build_data.py --check
      - name: Icone
        run: python3 app/tools/make_icons.py --check
      - name: "Caratteri (presenti: si riscaricano solo a mano)"
        run: python3 app/tools/fetch_fonts.py --check
      - name: Elenco dei file da tenere offline e versione
        run: python3 app/tools/build_precache.py --check
      - name: "Sintassi 3.9 dove la versione non la scegliamo noi"
        run: python3 app/tools/controlla_39.py

  prove:
    name: Avvio, offline e installabilità
    needs: [dati]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Scarica il browser delle prove
        run: npx playwright install --with-deps chromium
      - name: Prove (il server lo avvia Playwright)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prove-fallite
          path: app/test-results/
          retention-days: 7
