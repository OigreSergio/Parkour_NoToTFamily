name: Servizio remoto

# Lint e test a ogni modifica di remote-service/; sui push su main costruisce
# l'immagine Docker, la avvia una volta per provare /healthz, e la pubblica su
# GitHub Container Registry, da cui qualunque host la può avviare (vedi
# remote-service/README.md). Un terzo lavoro ripete lint e test sulla release
# candidate della 3.15 senza poter bloccare niente: serve solo a sapere in
# anticipo cosa si romperà. La scansione dei segreti di tutto il repository
# sta in gitleaks.yml, perché deve girare anche quando questa cartella non
# cambia.
#
# È il primo pezzo della pipeline "da main a online, sempre e solo via CI"
# del masterplan (cap. 4.6). Non fa deploy da solo: quella è una scelta
# dell'admin (decisione aperta G) e richiede segreti che non stanno qui.

on:
  push:
    branches: [main]
    paths:
      - "remote-service/**"
      - ".github/workflows/remote-service.yml"
  pull_request:
    paths:
      - "remote-service/**"
      - ".github/workflows/remote-service.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Lint e test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Il pavimento dichiarato in pyproject.toml (`requires-python`): è la
          # versione su cui il lavoro deve passare per essere considerato buono.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: remote-service/pyproject.toml
      - name: Installa il pacchetto con gli strumenti di sviluppo
        run: pip install -e ".[dev]"
      - name: Ruff (stile e errori evidenti)
        run: ruff check .
      - name: "Pytest (nessuna rete: Supabase e OSRM sono finti)"
        run: pytest
      - name: Il comando risponde e non stampa segreti
        shell: bash  # aggiunge `-o pipefail`: un crash di `pkremote config` fa fallire il passo
        env:
          SUPABASE_URL: https://esempio.supabase.co
          SUPABASE_SECRET_KEY: segreto-di-prova-non-reale-per-la-ci
        run: |
          pkremote --version
          pkremote jobs
          pkremote config | tee config.json
          python -c 'import json; json.load(open("config.json"))'
          ! grep -q "di-prova-non-reale" config.json

  next-version:
    name: Lint e test sulla prossima versione (3.15 rc)
    runs-on: ubuntu-latest
    # Un avviso in anticipo, non un cancello. La versione che decide resta la
    # 3.14 del lavoro `test`; qui si ripetono lint e test sulla release
    # candidate della 3.15 per scoprire un'incompatibilità mentre c'è tempo per
    # rimediare, invece che il giorno in cui la 3.15 esce. `continue-on-error`
    # fa sì che un fallimento resti un avviso: il lavoro `image` dipende solo da
    # `test`, quindi la pubblicazione dell'immagine non passa mai di qui.
    #
    # È una copia a mano dei primi tre passi di `test`, non tutto `test`: la
    # prova del comando (`pkremote config`, i segreti) resta solo là, perché su
    # una release candidate direbbe della 3.15, non del nostro codice. Chi
    # aggiunge o cambia un passo di lint o di test in `test` lo aggiunga anche
    # qui, altrimenti i due lavori si allontanano in silenzio.
    continue-on-error: true
    defaults:
      run:
        working-directory: remote-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Oggi l'elenco di actions/python-versions contiene 3.15.0-rc.2, ma
          # senza `allow-prereleases` setup-python scarta le release candidate e
          # installerebbe un'altra versione senza dirlo.
          python-version: "3.15"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: remote-service/pyproject.toml
      # Più lento degli altri lavori di qualche minuto: per la 3.15 httptools non
      # ha ancora ruote precompilate e pip lo compila dai sorgenti.
      - name: Installa il pacchetto con gli strumenti di sviluppo
        run: pip install -e ".[dev]"
      - name: Ruff (stile e errori evidenti)
        run: ruff check .
      - name: "Pytest (nessuna rete: Supabase e OSRM sono finti)"
        run: pytest

  image:
    name: Immagine Docker
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Nome dell'immagine (il registro vuole minuscole)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pkremote" >> "$GITHUB_OUTPUT"
      - name: Costruisce l'immagine per questa macchina e la prova
        uses: docker/build-push-action@v6
        with:
          context: remote-service
          load: true
          push: false
          tags: pkremote:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Avvia il container e interroga /healthz
        run: |
          docker run -d --name smoke -p 8080:8080 -e CORS_ORIGINS=http://localhost pkremote:smoke
          curl --silent --show-error --fail --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8080/healthz
          docker logs smoke
          docker rm -f smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pubblica l'immagine per amd64 e arm64
        uses: docker/build-push-action@v6
        with:
          context: remote-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
