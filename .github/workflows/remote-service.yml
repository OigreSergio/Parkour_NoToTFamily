name: Servizio remoto

# Lint e test a ogni modifica di remote-service/; sui push su main costruisce
# l'immagine Docker, la avvia una volta per provare /healthz, e la pubblica su
# GitHub Container Registry, da cui qualunque host la può avviare (vedi
# remote-service/README.md). La scansione dei segreti di tutto il repository
# sta in gitleaks.yml, perché deve girare anche quando questa cartella non
# cambia.
#
# È il primo pezzo della pipeline "da main a online, sempre e solo via CI"
# del masterplan (cap. 4.6). Non fa deploy da solo: quella è una scelta
# dell'admin (decisione aperta G) e richiede segreti che non stanno qui.

on:
  push:
    branches: [main]
    paths:
      - "remote-service/**"
      - ".github/workflows/remote-service.yml"
  pull_request:
    paths:
      - "remote-service/**"
      - ".github/workflows/remote-service.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Lint e test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: remote-service/pyproject.toml
      - name: Installa il pacchetto con gli strumenti di sviluppo
        run: pip install -e ".[dev]"
      - name: Ruff (stile e errori evidenti)
        run: ruff check .
      - name: "Pytest (nessuna rete: Supabase e OSRM sono finti)"
        run: pytest
      - name: Il comando risponde e non stampa segreti
        shell: bash  # aggiunge `-o pipefail`: un crash di `pkremote config` fa fallire il passo
        env:
          SUPABASE_URL: https://esempio.supabase.co
          SUPABASE_SECRET_KEY: segreto-di-prova-non-reale-per-la-ci
        run: |
          pkremote --version
          pkremote jobs
          pkremote config | tee config.json
          python -c 'import json; json.load(open("config.json"))'
          ! grep -q "di-prova-non-reale" config.json

  image:
    name: Immagine Docker
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Nome dell'immagine (il registro vuole minuscole)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pkremote" >> "$GITHUB_OUTPUT"
      - name: Costruisce l'immagine per questa macchina e la prova
        uses: docker/build-push-action@v6
        with:
          context: remote-service
          load: true
          push: false
          tags: pkremote:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Avvia il container e interroga /healthz
        run: |
          docker run -d --name smoke -p 8080:8080 -e CORS_ORIGINS=http://localhost pkremote:smoke
          # Il proxy delle porte di Docker accetta la connessione TCP prima che il
          # processo nel container ascolti, poi la chiude di colpo: per curl è un
          # "connection reset" (errore 56), non un rifiuto, quindi --retry-connrefused
          # da solo non ritenta mai. --retry-all-errors ritenta su qualsiasi errore.
          curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-all-errors \
            --output healthz.json http://127.0.0.1:8080/healthz
          cat healthz.json
          python3 -c 'import json; assert json.load(open("healthz.json"))["status"] == "ok"'
      - name: Log del container (anche quando la prova fallisce)
        if: always()
        run: |
          docker logs smoke || echo "il container non è mai partito"
          docker rm -f smoke >/dev/null 2>&1 || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pubblica l'immagine per amd64 e arm64
        uses: docker/build-push-action@v6
        with:
          context: remote-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
