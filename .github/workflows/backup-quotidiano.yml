name: "📲 Backup quotidiano"

# Ogni 24 ore rigenera da zero la branch `backup`: la versione precedente
# viene distrutta e sostituita dal backup più recente.
#
# La branch `backup` è PUBBLICA su un repo pubblico: ci finiscono solo i
# contenuti della community (spot, foto, fontanelle, video). Nessuna tabella
# con dati personali — vedi la lista in 📲/backup.mjs.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC ogni notte
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera il backup pubblico
        run: node "📲/backup.mjs"

      - name: Distruggi e rigenera la branch backup
        run: |
          git config user.name "pkfamily-backup"
          git config user.email "backup@pkfamily.local"
          git checkout --orphan backup
          git rm -rf --cached . >/dev/null
          git add -f "📲/backup-quotidiano.json" "📲/backup.mjs" "📲/README.md"
          git commit -m "backup quotidiano $(date -u +%Y-%m-%d)"
          git push -f origin backup
