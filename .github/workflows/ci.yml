name: CI

# Fino a oggi il repo non aveva nessun workflow di qualità, nonostante README e
# SECURITY.md ne dessero per scontata l'esistenza. Questo è il minimo che deve
# restare verde prima di ogni merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App Flutter (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      - name: Formattazione
        run: dart format --set-exit-if-changed .
        working-directory: mobile

      - name: Analisi statica
        run: flutter analyze
        working-directory: mobile

      - name: Test
        run: flutter test
        working-directory: mobile

      # Il build usa valori segnaposto: serve a dimostrare che compila, non a
      # produrre un artefatto pubblicabile. Le chiavi vere arrivano dai secret
      # nei workflow di deploy.
      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder
        working-directory: mobile

  dati:
    name: Qualità dei dati degli spot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Impedisce che tornino i dati che non sono dati: attributi di default
      # mostrati come valutazioni, nomi di terzi scrapati, foto senza licenza.
      - name: Il dataset è pulito
        run: python3 scripts/clean_spots.py --check

      - name: Test della pulizia
        run: python3 scripts/test_clean_spots.py

      # Mapillary è CC-BY-SA e Wikimedia richiede l'attribuzione: una foto di
      # terzi senza autore e licenza non è pubblicabile, e il database la
      # rifiuta comunque.
      - name: Ogni foto ha i suoi crediti
        run: python3 scripts/resolve_photo_credits.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Copertura della mappa
        run: node scripts/spot_coverage.mjs

      # Le policy RLS sono l'unica difesa del database: la publishable key
      # finisce nel bundle e ce l'hanno tutti. Questo controlla da fuori cosa
      # vede un estraneo. Gira solo se i secret ci sono — senza, salta con un
      # avviso invece di far fallire il build a chi clona il repo.
      - name: Cosa vede un estraneo (RLS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::Secret Supabase assenti: audit RLS saltato."
            exit 0
          fi
          node scripts/audit_rls.mjs

  admin:
    name: Console di moderazione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - run: npm ci
        working-directory: web-admin

      - run: npm run lint
        working-directory: web-admin

      - run: npm run build
        working-directory: web-admin
