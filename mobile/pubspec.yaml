name: parkour_notot
description: "PkFAMILY — la mappa degli spot, la community e i video per chi inizia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1

  # Backend: Supabase (Postgres + Auth + Realtime + RLS).
  # `backend/` (FastAPI) resta nel repo come riferimento di dominio ma non è
  # deployato: nessun percorso di codice ci arriva più.
  supabase_flutter: ^2.8.0

  # Map
  flutter_map: ^7.0.2
  # Tile vettoriali: OpenFreeMap è gratuito, senza chiave e senza limiti, ed è
  # l'unica sorgente conforme che non costi niente. I tile raster pubblici di
  # OSM (tile.openstreetmap.org) sono vietati dalla loro usage policy per
  # un'app come questa.
  # Resta su flutter_map 7: per flutter_map 8 vector_map_tiles è solo in beta,
  # e la mappa è il cuore dell'app.
  vector_map_tiles: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Link esterni (attribuzione OSM, indicazioni stradali)
  url_launcher: ^6.3.0

  # Video player
  video_player: ^2.9.1
  cached_network_image: ^3.4.0

  # Preferenze locali (storage tecnico: nessun dato personale)
  shared_preferences: ^2.3.2

  # Hash del testo del gate di sicurezza, calcolato dal file mostrato
  crypto: ^3.0.5

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    # Testi legali versionati: l'hash del file è ciò che finisce nella
    # registrazione della presa d'atto, quindi il file È la fonte di verità.
    - assets/legal/

  # Roboto, servito da noi.
  #
  # Non è una scelta estetica: è lo stesso font che Flutter web userebbe
  # comunque, ma **scaricandolo da `fonts.gstatic.com` all'avvio**. Due
  # problemi in uno. Primo, è una richiesta verso Google prima che l'utente
  # tocchi qualcosa, mentre l'informativa dichiara che non ne parte nessuna.
  # Secondo, la CSP che serviamo ha `font-src 'self'` e quella richiesta la
  # blocca: senza font, CanvasKit non disegna il testo e **l'app va online
  # muta** — pulsanti al posto giusto e nessuna parola sopra. Verificato con
  # uno screenshot prima di accorgersene in produzione.
  #
  # Licenza Apache 2.0, vedi assets/fonts/LICENSE.txt.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
