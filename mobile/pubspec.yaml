name: parkour_notot
description: "Parkour NoToT Family — find spots, chat, train."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP
  http: ^1.2.2
  dio: ^5.5.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Map — vector tiles so the "ricamo" MapLibre style renders as designed
  flutter_map: ^8.2.0
  flutter_map_vector_tiles: ^2.8.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Video player
  video_player: ^2.9.1
  cached_network_image: ^3.4.0

  # Open tutorials hosted on video platforms (YouTube) outside the app
  url_launcher: ^6.3.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  image_picker: ^1.2.3
  http_parser: ^4.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/water/
    - assets/fonts/OFL.txt

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
