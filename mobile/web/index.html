<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Sostituito da `flutter build web --base-href`. Su pkfamily.app resta "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="La mappa degli spot di parkour, la community e i video per chi inizia. Progetto della community, gratuito.">

  <!-- Nessun tracker, nessuna risorsa di terze parti caricata da questa pagina:
       la CSP servita da Cloudflare Pages (_headers) è restrittiva e le richieste
       verso l'esterno partono solo dopo il consenso dell'utente. -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PkFAMILY">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Anteprima quando il link viene incollato in una chat, che è come questa
       app verrà condivisa nove volte su dieci. Gli URL sono assoluti perché
       WhatsApp e Telegram non risolvono i percorsi relativi.

       `og:image` punta all'icona e non a uno screenshot della mappa: uno
       screenshot con dei pin sopra inviterebbe a leggerci delle posizioni, e
       il primo contatto con l'app non deve essere un elenco di posti dove
       andare a saltare. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PkFAMILY">
  <meta property="og:title" content="PkFAMILY — spot, community e allenamento parkour">
  <meta property="og:description" content="La mappa degli spot, la chat della community e i video per chi inizia. Progetto della community, gratuito.">
  <meta property="og:url" content="https://pkfamily.app/">
  <meta property="og:image" content="https://pkfamily.app/icons/Icon-512.png">
  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="https://pkfamily.app/">

  <title>PkFAMILY</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <noscript>
    <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #eee; background: #111;">
      PkFAMILY ha bisogno di JavaScript per funzionare.
    </p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
