<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>PkFAMILY · Accademia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤸</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #ECEDEA;
    --panel: #F7F7F5;
    --ink: #191A1C;
    --ink-soft: #5A5C58;
    --line: #D3D5CF;
    --accent: #2743E3;
    --accent-ink: #FFFFFF;
    --ok: #2E7D46;
    --wait: #B97A0E;
    --danger: #B3362B;
    --chip: #E4E5E1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171A;
      --panel: #1E2024;
      --ink: #E8E9E6;
      --ink-soft: #9A9C99;
      --line: #33353A;
      --accent: #7C90FF;
      --accent-ink: #10122B;
      --ok: #5FBF82;
      --wait: #E0A94E;
      --danger: #E07A6E;
      --chip: #26282D;
    }
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  header.app {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: baseline; gap: 8px;
  }
  header.app .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 18px; }
  header.app .brand span { color: var(--accent); }
  header.app .sub { color: var(--ink-soft); font-size: 13px; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 22px; letter-spacing: -0.02em; margin: 8px 0 4px; }
  h3 { font-size: 15px; margin: 20px 0 8px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  p.lead { color: var(--ink-soft); margin: 0 0 16px; font-size: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .card.tap { cursor: pointer; }
  .card.tap:active { transform: scale(0.99); }

  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .title { font-weight: 700; font-size: 15px; }
  .meta { color: var(--ink-soft); font-size: 12.5px; }

  .chip {
    display: inline-block; font-size: 11.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-soft);
    margin-right: 4px; white-space: nowrap;
  }
  .chip.lv-principiante { color: var(--ok); }
  .chip.lv-intermedio  { color: var(--wait); }
  .chip.lv-avanzato    { color: var(--danger); }
  .state {
    font-size: 20px; width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--chip); flex: none;
  }
  .state.landed { background: var(--ok); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hub-tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  }
  .hub-tile .emoji { font-size: 26px; }
  .hub-tile .t { font-weight: 700; margin-top: 6px; }
  .hub-tile .d { color: var(--ink-soft); font-size: 12.5px; }

  .bar { height: 8px; border-radius: 999px; background: var(--chip); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }

  button.btn {
    font: inherit; font-weight: 700; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
    border-radius: 12px; padding: 10px 14px; cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.btn.small { padding: 7px 10px; font-size: 13px; border-radius: 10px; }
  button.btn:active { transform: scale(0.98); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }

  input[type="search"], input[type="date"], select {
    font: inherit; width: 100%;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  }
  .filters { display: flex; gap: 8px; margin: 10px 0; }
  .filters select { width: auto; flex: 1; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs a {
    text-decoration: none; color: var(--ink-soft); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 10px; border-radius: 10px; min-width: 56px;
  }
  nav.tabs a .ico { font-size: 20px; line-height: 1; }
  nav.tabs a.on { color: var(--accent); background: var(--chip); }

  .steps { counter-reset: step; padding: 0; margin: 8px 0; list-style: none; }
  .steps li {
    counter-increment: step; position: relative;
    padding: 0 0 14px 40px; font-size: 14.5px;
  }
  .steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: 0;
    width: 26px; height: 26px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  ul.plain { padding-left: 18px; margin: 8px 0; font-size: 14px; }
  ul.plain li { margin-bottom: 6px; }

  .callout {
    border-left: 3px solid var(--wait);
    background: var(--chip); border-radius: 0 12px 12px 0;
    padding: 10px 12px; font-size: 13.5px; margin: 12px 0;
  }
  .callout.safety { border-left-color: var(--danger); }

  .videobox {
    position: relative; border-radius: 14px; overflow: hidden;
    background: #000; aspect-ratio: 16 / 9; margin: 12px 0;
  }
  .videobox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .videobox .ph {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; color: #fff; text-align: center; padding: 16px;
  }
  .videobox .ph .play { font-size: 42px; }
  .videobox .ph small { opacity: 0.75; }

  .badgegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 8px; text-align: center;
  }
  .badge .e { font-size: 30px; filter: grayscale(1); opacity: 0.35; }
  .badge.won .e { filter: none; opacity: 1; }
  .badge .n { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .badge .d { font-size: 11px; color: var(--ink-soft); }

  .back { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 14px; display: inline-block; margin-bottom: 8px; }
  .goalline { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

  #toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .3s; z-index: 20; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
</style>
</head>

/* ---------- stato ---------- */
const STORE_KEY = "pkfamily_accademia_v1";
let stato = caricaStato();

function caricaStato() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign({ progress: {}, goals: {}, opened: [], badges: [] }, JSON.parse(raw));
  } catch (e) { /* storage non disponibile: si vive in memoria */ }
  return { progress: {}, goals: {}, opened: [], badges: [] };
}
function salvaStato() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(stato)); } catch (e) { /* ok */ }
  controllaBadge();
}
function contaLanded(s) { return Object.values(s.progress).filter(v => v === "landed").length; }

function controllaBadge() {
  for (const b of BADGES) {
    if (!stato.badges.includes(b.id) && b.test(stato)) {
      stato.badges.push(b.id);
      try { localStorage.setItem(STORE_KEY, JSON.stringify(stato)); } catch (e) { /* ok */ }
      toast(`🏅 Badge sbloccato: ${b.nome}!`);
    }
  }
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const byId = id => TRICKS.find(t => t.id === id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function statoTrick(id) { return stato.progress[id] || "todo"; }
function iconaStato(id) {
  const s = statoTrick(id);
  return s === "landed" ? "✅" : s === "training" ? "💪" : "▫️";
}
function chipLivello(lv) { return `<span class="chip lv-${lv}">${lv}</span>`; }

function cardTrick(t) {
  const s = statoTrick(t.id);
  return `<div class="card tap row" onclick="location.hash='#/trick/${t.id}'">
    <div class="state ${s === "landed" ? "landed" : ""}">${iconaStato(t.id)}</div>
    <div class="grow">
      <div class="title">${esc(t.nome)}</div>
      <div class="meta">${CATEGORIE[t.cat].emoji} ${CATEGORIE[t.cat].nome} · ${chipLivello(t.lv)}</div>
    </div>
    <div class="meta">›</div>
  </div>`;
}

    const t = byId(id); if (!t) return "";

    }
    return `<div class="card tap row" onclick="location.hash='#/trick/${id}'">
      <div class="state ${statoTrick(id) === "landed" ? "landed" : ""}">${statoTrick(id) === "landed" ? "🏆" : "🎯"}</div>

    ${video}
    <div class="btnrow">
      <button class="btn small ${s === "todo" ? "primary" : ""}" onclick="setProgress('${id}','todo')">▫️ Da imparare</button>
      <button class="btn small ${s === "training" ? "primary" : ""}" onclick="setProgress('${id}','training')">💪 In allenamento</button>
      <button class="btn small ${s === "landed" ? "primary" : ""}" onclick="setProgress('${id}','landed')">✅ Landed!</button>
    </div>
    ${t.prereq.length ? `<h3>Prerequisiti ${prereqOk ? "✅" : ""}</h3>
      ${t.prereq.map(p => cardTrick(byId(p))).join("")}
      ${prereqOk ? "" : `<div class="callout">Prima di provare questo trick, landa i prerequisiti: la progressione è la tua assicurazione.</div>`}` : ""}
    <h3>Tutorial passo-passo</h3>
    <ol class="steps">${t.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    <h3>Errori comuni</h3>
    <ul class="plain">${t.errori.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="callout safety">🛡️ <b>Landa sicuro:</b> ${esc(t.safety)}</div>
    <h3>Obiettivo</h3>
    ${stato.goals[id]
      ? `<div class="card row"><div class="state">🎯</div>
           <div class="grow"><div class="title">Obiettivo attivo</div>
           <div class="meta">${stato.goals[id].data ? "entro il " + new Date(stato.goals[id].data).toLocaleDateString("it-IT") : "senza scadenza"}</div></div>
           <button class="btn small" onclick="rimuoviObiettivo('${id}')">Rimuovi</button></div>`
      : `<div class="card"><div class="title" style="margin-bottom:6px">Vuoi landarlo entro una data?</div>
           <div class="goalline">
             <input type="date" id="goal-data">
             <button class="btn small primary" onclick="impostaObiettivo('${id}')">🎯 Imposta</button>
           </div></div>`}`;
}

/* ---------- azioni ---------- */
function setProgress(id, val) {
  stato.progress[id] = val;
  salvaStato();
  if (val === "landed") toast("✅ Landed! Grande!");
  render();
}
function impostaObiettivo(id) {
  const el = document.getElementById("goal-data");
  stato.goals[id] = { data: el && el.value ? el.value : null };
  salvaStato();
  toast("🎯 Obiettivo impostato!");
  render();
}
function rimuoviObiettivo(id) {
  delete stato.goals[id];
  salvaStato();
  render();
}
function suggerisci() {
  /* come il "suggestions generator" dell'app originale: propone un trick
     sbloccato (prerequisiti landati) e non ancora landato */
  const pronti = TRICKS.filter(t => statoTrick(t.id) !== "landed" &&
    t.prereq.every(p => statoTrick(p) === "landed"));
  const pool = pronti.length ? pronti : TRICKS.filter(t => statoTrick(t.id) !== "landed");
  if (!pool.length) { toast("👑 Li hai landati tutti!"); return; }
  const scelto = pool[Math.floor(Math.random() * pool.length)];
  toast(`✨ Prova: ${scelto.nome}`);
  location.hash = "#/trick/" + scelto.id;
}

/* ---------- router ---------- */
function render() {
  const hash = location.hash || "#/";
  const parti = hash.replace(/^#\//, "").split("/");
  let tab = "home", html = "";
  if (parti[0] === "tutorial") { tab = "tutorial"; html = vistaTutorial(); }
  else if (parti[0] === "trick" && parti[1]) { tab = "trick"; html = vistaTrick(parti[1]); }
  else if (parti[0] === "trick") { tab = "trick"; html = vistaDatabase(); }
  else if (parti[0] === "obiettivi") { tab = "obiettivi"; html = vistaObiettivi(); }
  else if (parti[0] === "badge") { tab = "badge"; html = vistaBadge(); }
  else { html = vistaHome(); }
  $app.innerHTML = html;
  document.querySelectorAll("nav.tabs a").forEach(a =>
    a.classList.toggle("on", a.dataset.tab === tab));
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
controllaBadge();
render();
</script>
</body>
</html>
